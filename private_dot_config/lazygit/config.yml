gui:
  nerdFontsVersion: "3" # PlemolJP v2.0.0 uses Nerd Fonts v3.3.0
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  branchLogCmd: git log --graph --color=always --date-order --all --pretty=format:'%h %Cred%d %Cgreen%ad %Cblue%cn %n%Creset%s%n' --date=short
  allBranhesLogCmds: git log --graph --color=always --date-order --all --pretty=format:'%h %Cred%d %Cgreen%ad %Cblue%cn %Creset%s' --date=short
