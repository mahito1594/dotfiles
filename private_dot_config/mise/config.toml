[tools]
"aqua:astral-sh/uv" = "latest"
"aqua:aws/aws-cli" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:rhysd/actionlint" = "latest"
"cargo:cargo-binstall" = "latest"
deno = "2"
github-cli = "latest"
marksman = "latest"
node = "lts"
"npm:ccusage" = "latest"
"npm:vscode-langservers-extracted" = "latest"
pnpm = "latest"
rust = { version  = "latest", profile = "default", components = "rust-analyzer" }
taplo = "latest"

[settings]
idiomatic_version_file_enable_tools = []

[settings.python]
uv_venv_auto = true

[settings.npm]
package_manager = "pnpm"
