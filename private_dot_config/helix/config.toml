theme = "catppuccin_macchiato"

[editor]
end-of-line-diagnostics = "hint"

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
auto-signature-help = false

[keys.insert]
C-g = "normal_mode"
C-p = "move_line_up"
C-n = "move_line_down"
C-b = "move_char_left"
C-f = "move_char_right"
C-a = "goto_line_start"
C-e = "goto_line_end_newline"
C-j = ["add_newline_below", "move_line_down"]

[keys.normal.space]
s = "signature_help"
